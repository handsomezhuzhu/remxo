[package]
name = "remxo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Remote execution for humans and agents"
license = "MIT"

[lib]
name = "remxo"
path = "src/lib.rs"

[[bin]]
name = "remxo"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
hex = "0.4"
rand = "0.8"
ratatui = "0.30"
regex = "1.11"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[lints.rust]
unsafe_code = "forbid"
