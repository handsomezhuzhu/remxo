name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remxo-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: ${{ matrix.os }} / Rust stable
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust format and lint components
        shell: bash
        run: rustup component add rustfmt clippy
      - name: Check Python integration syntax
        shell: bash
        run: python3 -m compileall -q tests/integration tests/run_all.py
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --all-targets -- --test-threads=1
      - name: Build
        shell: bash
        run: cargo build

  npm-launcher:
    name: ${{ matrix.os }} / npm launcher
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test launcher and offline package
        shell: bash
        run: npm test --prefix npm
