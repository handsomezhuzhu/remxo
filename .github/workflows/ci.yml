name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remxo-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: ${{ matrix.os }} / Rust stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust format and lint components
        shell: bash
        run: rustup component add rustfmt clippy
      - name: Check Python integration syntax
        shell: bash
        run: python3 -m compileall -q tests/integration tests/run_all.py
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --all-targets -- --test-threads=1
      - name: Build
        shell: bash
        run: cargo build

  msrv:
    name: Linux / Rust 1.88 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test with the declared minimum Rust version
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/data/workspace/remxo" \
            --workdir /data/workspace/remxo \
            rust:1.88.0-slim-bookworm \
            bash -c 'cargo test --all-targets -- --test-threads=1'
