name: npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (defaults to npm/package.json)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: remxo-npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: ${{ matrix.platform }} core
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            binary: remxo.exe
          - platform: linux-x64
            runner: instabox-medium
            rust-target: x86_64-unknown-linux-gnu
            binary: remxo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release-version
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="$RELEASE_INPUT_VERSION"
          fi
          if [[ -z "$value" ]]; then
            value="$(node -p "require('./npm/package.json').version")"
          fi
          if [[ "$value" == *[!0-9A-Za-z.+-]* ]]; then
            echo "invalid package version" >&2
            exit 1
          fi
          echo "version=$value" >> "$GITHUB_OUTPUT"
      - name: Test launcher
        shell: bash
        run: npm test --prefix npm
      - name: Build native core
        shell: bash
        run: |
          rustup target add "${{ matrix.rust-target }}"
          cargo build --release --locked --target "${{ matrix.rust-target }}"
      - name: Verify, stage, and pack native core
        shell: bash
        run: |
          node scripts/npm/pack.js \
            --platform "${{ matrix.platform }}" \
            --artifact "$PWD/target/${{ matrix.rust-target }}/release/${{ matrix.binary }}" \
            --version "${{ steps.release-version.outputs.version }}" \
            --out "$PWD/artifacts/${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: remxo-core-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/*.tgz
          if-no-files-found: error
          retention-days: 14

  launcher:
    name: remxo launcher
    needs: core
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release-version
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="$RELEASE_INPUT_VERSION"
          fi
          if [[ -z "$value" ]]; then
            value="$(node -p "require('./npm/package.json').version")"
          fi
          if [[ "$value" == *[!0-9A-Za-z.+-]* ]]; then
            echo "invalid package version" >&2
            exit 1
          fi
          echo "version=$value" >> "$GITHUB_OUTPUT"
      - name: Test launcher
        run: npm test --prefix npm
      - name: Pack launcher with pinned optional dependencies
        run: |
          node scripts/npm/pack.js \
            --main \
            --version "${{ steps.release-version.outputs.version }}" \
            --out "$PWD/artifacts/launcher"
      - uses: actions/download-artifact@v4
        with:
          name: remxo-core-linux-x64
          path: artifacts/linux-x64
      - name: Smoke-test the exact Linux tarball installation
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/remxo-npm-smoke"
          npm install --prefix "$destination" \
            --ignore-scripts --omit=optional --offline --no-audit --no-fund \
            "$PWD"/artifacts/launcher/*.tgz "$PWD"/artifacts/linux-x64/*.tgz
          test "$("$destination/node_modules/.bin/remxo" --version)" = "remxo ${{ steps.release-version.outputs.version }}"
          "$destination/node_modules/.bin/remxo" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: remxo-npm-launcher
          path: artifacts/launcher/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: npm stage publish
    needs: [core, launcher]
    if: startsWith(github.ref, 'refs/tags/v/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${{ inputs.version }}"
          fi
          if [[ -z "$value" ]]; then
            value="$(node -p "require('./npm/package.json').version")"
          fi
          if [[ "$value" == *[!0-9A-Za-z.+-]* ]]; then
            echo "invalid package version" >&2
            exit 1
          fi
          echo "version=$value" >> "$GITHUB_OUTPUT"
          if [[ "$value" == *-* ]]; then
            echo "dist-tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Use npm with staged publishing support
        run: npm install --global npm@11.15.0
      - name: Download native core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remxo-core-*
          path: artifacts/cores
          merge-multiple: true
      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: remxo-npm-launcher
          path: artifacts/launcher
      - name: Stage platform cores
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tarball in artifacts/cores/*.tgz; do
            npm stage publish --access public --tag "${{ steps.release-version.outputs.dist-tag }}" --provenance "$tarball"
          done
      - name: Stage launcher
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm stage publish --access public --tag "${{ steps.release-version.outputs.dist-tag }}" --provenance artifacts/launcher/*.tgz
